<!doctype html>
<meta charset="utf-8">
<title>Taco &amp; Nova channel banner</title>
<style>
  /* ── 要改字改這裡 ──────────────────────── */
  :root {
    --gold: #f7c948;
    --progress: 4%;          /* 進度條長度 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 2048px; height: 1152px; overflow: hidden; }

  .stage {
    position: relative; width: 2048px; height: 1152px; overflow: hidden;
    background: #0a1119;
    font-family: "Arial Black", "Segoe UI Black", "Microsoft JhengHei", sans-serif;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(70% 62% at 50% 80%, rgba(247,166,45,.24), transparent 68%),
      radial-gradient(115% 95% at 50% 36%, #2c4b6e 0%, #16283e 44%, #0a1119 100%);
  }

  /* 斜向光束，讓深色底不死板 */
  .beam {
    position: absolute; inset: -20%;
    background: linear-gradient(104deg, transparent 38%, rgba(255,255,255,.05) 50%, transparent 62%);
  }

  /* ── 兩隻狗（已去背）───────────────────── */
  .dog { position: absolute; background-repeat: no-repeat; background-size: contain; }
  .dog::after {   /* 腳下的落地陰影 */
    content: ""; position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%);
    width: 78%; height: 60px; border-radius: 50%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.55), transparent 72%);
  }
  .nova {
    left: 330px; top: 290px; width: 402px; height: 700px;   /* 402:700 = 圖片原比例，別亂改 */
    background-image: url("assets/nova-cut.png");
    filter: drop-shadow(0 18px 40px rgba(0,0,0,.55));
    /* 左右緣淡出：原始照片是從狗床那張裁出來的，兩側都有硬切邊要藏掉 */
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 11%, #000 86%, transparent 100%);
  }
  .taco {
    left: 1235px; top: 400px; width: 473px; height: 620px;  /* 473:620 = 圖片原比例 */
    background-image: url("assets/taco-cut.png");
    filter: drop-shadow(0 18px 40px rgba(0,0,0,.55));
  }

  /* ── 中央文字（整組在手機安全區 1235×338 內）── */
  .copy {
    position: absolute; left: 50%; top: 576px; transform: translate(-50%, -50%);
    width: 720px; text-align: center; color: #fff;
  }
  .title {
    font-size: 92px; line-height: 1; letter-spacing: -2px;
    text-shadow: 0 8px 30px rgba(0,0,0,.8), 0 2px 3px rgba(0,0,0,.7);
  }
  .title .amp { color: var(--gold); font-size: .8em; }

  .tag {
    margin-top: 20px;
    font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
    font-size: 24px; letter-spacing: 4px; color: #e2ecf7;
    text-shadow: 0 3px 14px rgba(0,0,0,.85);
  }

  /* ── 訂閱進度條 ───────────────────────── */
  .goal { margin: 26px auto 0; width: 500px; }
  .goal-label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: "Segoe UI Semibold", "Segoe UI", sans-serif;
    font-size: 17px; letter-spacing: 2px;
    color: var(--gold); text-shadow: 0 2px 10px rgba(0,0,0,.9);
  }
  .goal-label .right { color: rgba(226,236,247,.7); letter-spacing: 2px; }
  .bar {
    margin-top: 10px; height: 16px; border-radius: 99px;
    background: rgba(255,255,255,.16);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.55);
    overflow: hidden;
  }
  .bar span {
    display: block; height: 100%; width: var(--progress);
    border-radius: 99px;
    background: linear-gradient(90deg, #ffd66b, #ff9f1c);
    box-shadow: 0 0 16px rgba(247,201,72,.8);
  }

  .handle {
    position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%);
    font-family: "Segoe UI", sans-serif; font-weight: 600;
    font-size: 23px; letter-spacing: 7px; color: rgba(219,230,242,.5);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(78% 78% at 50% 50%, transparent 52%, rgba(4,8,13,.78) 100%);
  }
</style>

<div class="stage">
  <div class="bg"></div>
  <div class="beam"></div>

  <div class="dog nova"></div>
  <div class="dog taco"></div>

  <div class="copy">
    <div class="title">TACO <span class="amp">&amp;</span><br>NOVA</div>
    <div class="tag">ZERO SHAME. ZERO REGRETS.</div>
    <div class="goal">
      <div class="goal-label">
        <span>ROAD TO 1K SUBSCRIBERS</span>
        <span class="right">NEW SHORTS WEEKLY</span>
      </div>
      <div class="bar"><span></span></div>
    </div>
  </div>

  <div class="handle">@TACOANDNOVA</div>
  <div class="vignette"></div>
</div>
