<!doctype html>
<meta charset="utf-8">
<title>Taco &amp; Nova channel avatar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 800px; height: 800px; overflow: hidden; }

  .stage {
    position: relative; width: 800px; height: 800px;
    background: #0b131e;      /* 四角會被 YouTube 裁成圓形，填深底避免白邊 */
  }
  .clip { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }

  /* 臉：稍微放大並下移，讓圓形裁切後臉剛好滿版 */
  .face {
    position: absolute; inset: 0;
    background: url("assets/taco-face.jpg") center 42% / 96% no-repeat;
  }

  /* 下緣壓暗，讓底部的品牌字看得清楚 */
  .fade {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(7,12,20,.92) 0%, rgba(7,12,20,.45) 14%, transparent 30%);
  }

  /* 金色圓環：貼著 YouTube 的圓形裁切邊 */
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 11px solid #eab93f;
    box-shadow: inset 0 0 70px rgba(0,0,0,.5);
  }

  .name {
    position: absolute; left: 0; right: 0; bottom: 44px;
    text-align: center;
    font-family: "Arial Black", "Segoe UI Black", sans-serif;
    font-size: 44px; letter-spacing: 0px; color: #fff;
    text-shadow: 0 4px 18px rgba(0,0,0,.9);
  }
  .name .amp { color: #f7c948; }
</style>

<div class="stage">
  <div class="clip">
    <div class="face"></div>
    <div class="fade"></div>
    <div class="name">TACO <span class="amp">&amp;</span> NOVA</div>
  </div>
  <div class="ring"></div>
</div>
